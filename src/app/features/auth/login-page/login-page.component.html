<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="login-card__title">Sign in</h1>

    <label class="login-card__label" for="login-username">Username</label>
    <input
      id="login-username"
      class="login-card__input"
      type="text"
      formControlName="username"
      autocomplete="username"
    />
    <p class="login-card__field-error" *ngIf="showRequiredError('username')">
      Username is required.
    </p>

    <label class="login-card__label" for="login-password">Password</label>
    <input
      id="login-password"
      class="login-card__input"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    <p class="login-card__field-error" *ngIf="showRequiredError('password')">
      Password is required.
    </p>

    <div class="login-card__toggle-row">
      <span class="login-card__label" id="login-mode-label">Mode</span>
      <mat-button-toggle-group formControlName="mode" aria-labelledby="login-mode-label">
        <mat-button-toggle value="operation">Operation</mat-button-toggle>
        <mat-button-toggle value="technician">Technician</mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <div class="login-card__toggle-row">
      <span class="login-card__label" id="login-position-label">Position</span>
      <mat-button-toggle-group formControlName="position" aria-labelledby="login-position-label">
        <mat-button-toggle value="active">Active</mat-button-toggle>
        <mat-button-toggle value="passive">Passive</mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <p class="login-card__error" *ngIf="loginFailed()">
      Login failed. Check your details and try again.
    </p>

    <button class="login-card__submit" mat-flat-button color="primary" type="submit">
      Sign in
    </button>
  </form>
</div>
