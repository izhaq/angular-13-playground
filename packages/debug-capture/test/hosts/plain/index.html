<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>debug-capture — plain HTML host</title>
  </head>
  <body>
    <h1>Plain host</h1>
    <p id="framework">
      Plain page: no framework, no bundler. Loads the prebuilt <code>activate.mjs</code> from a copy of
      <code>dist/</code> in <code>vendor/debug-capture/</code>; it loads <code>index.mjs</code> and
      <code>panel.mjs</code> when switched on.
    </p>
    <input id="host-input" aria-label="Host input" />
    <button id="host-request" type="button">Request</button>
    <button id="host-fail" type="button">Fail</button>
    <p id="host-reply">none</p>
    <!-- HLD §6.6, word for word (S10-03, 2.2). -->
    <script type="module">
      import { installDebugActivation } from './vendor/debug-capture/activate.mjs';
      window.debugReady = installDebugActivation().ready; // the page's own code awaits it before its first request
    </script>
    <!-- The page's own code. It waits for debugReady, so with ?debug=1 capture is on before this fetch. -->
    <script type="module">
      await window.debugReady;
      const reply = document.getElementById('host-reply');
      const load = () =>
        fetch('/api/ping')
          .then((response) => response.json())
          .then((body) => (reply.textContent = JSON.stringify(body)));
      document.getElementById('host-request').addEventListener('click', load);
      document.getElementById('host-fail').addEventListener('click', () => {
        throw new Error('plain host failure');
      });
      // For the e2e tests only: the active session (null while off), and the panel's tag once it is switched on.
      // index.mjs and panel.mjs are already loaded then (activate.mjs imported them), so this loads nothing new.
      const switchedOn = document.documentElement.querySelector(':scope > debug-capture-panel-v2') !== null;
      Object.defineProperty(window, '__hostSession', {
        get: () => window.__core?.getActiveCaptureSession() ?? null,
      });
      if (switchedOn) window.__core = await import('./vendor/debug-capture/index.mjs');
      window.panelElementName = switchedOn
        ? (await import('./vendor/debug-capture/panel.mjs')).PANEL_ELEMENT_NAME
        : null;
      window.hostDone = fetch('/api/ping').then((response) => response.json());
      window.__hostReady = true;
    </script>
  </body>
</html>
